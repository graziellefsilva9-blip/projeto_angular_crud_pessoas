<div class="container">

  <header>
    <h1>Cadastro de Clientes</h1>

    <nav>
      <a routerLink="/">Formulário</a>
      <a routerLink="/clientes">Consulta</a>
    </nav>
  </header>

  <section class="card">

    <h2>Dados Pessoais</h2>

    <form [formGroup]="formulario" (ngSubmit)="salvar()">

      <div class="campo">
        <label>Nome *</label>
        <input type="text" formControlName="nome">
      </div>

      <div class="campo">
        <label>E-mail *</label>
        <input type="email" formControlName="email">
      </div>

      <div class="linha">

        <div class="campo">
          <label>CPF *</label>
          <input type="text" formControlName="cpf">
        </div>

        <div class="campo">
          <label>Data de Nascimento *</label>
          <input type="date" formControlName="dataNascimento">
        </div>

      </div>

      <div class="linha">

        <div class="campo">

          <label>UF *</label>

          <select formControlName="uf" (change)="carregarMunicipios()">

            <option value="">Selecione</option>

            <option *ngFor="let uf of ufs" [value]="uf">
              {{ uf }}
            </option>

          </select>

        </div>

        <div class="campo">

          <label>Município *</label>

          <select formControlName="municipio">

            <option value="">Selecione</option>

            <option *ngFor="let cidade of listaMunicipios" [value]="cidade">
              {{ cidade }}
            </option>

          </select>

        </div>

      </div>

      <div class="botoes">

        <button type="submit" class="salvar">
          Salvar
        </button>

        <button type="reset" class="limpar">
          Limpar
        </button>

      </div>

    </form>

  </section>

  <section class="card">

    <h2>Clientes Cadastrados</h2>

    <table>

      <thead>

        <tr>

          <th>Nome</th>
          <th>E-mail</th>
          <th>CPF</th>
          <th>UF</th>
          <th>Município</th>
          <th>Ações</th>

        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let cliente of clientes">

          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.cpf }}</td>
          <td>{{ cliente.uf }}</td>
          <td>{{ cliente.municipio }}</td>

          <td class="acoes">

            <button
              type="button"
              class="editar"
              (click)="editar(cliente)">
              Editar
            </button>
            
            <button
              type="button"
              class="limpar"
              (click)="excluir(cliente.id)">
              Excluir
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</div>
