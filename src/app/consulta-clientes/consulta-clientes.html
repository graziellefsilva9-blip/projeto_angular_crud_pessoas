<div class="container">

    <header>
      <h1>Consulta de Clientes</h1>
  
      <nav>
        <a routerLink="/">Formulário</a>
        <a routerLink="/clientes">Consulta</a>
      </nav>
    </header>
  
    <section class="card">
  
      <h2>Clientes Cadastrados</h2>
  
      <table>
  
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th>Data de Nascimento</th>
            <th>UF</th>
            <th>Município</th>
            <th>Ações</th>
          </tr>
        </thead>
  
        <tbody>
  
          <tr *ngFor="let cliente of clientes">
  
            <td>
              {{ cliente.nome }}
            </td>
  
            <td>
              {{ cliente.email }}
            </td>
  
            <td>
              {{ cliente.cpf }}
            </td>
  
            <td>
              {{ cliente.dataNascimento }}
            </td>
  
            <td>
              {{ cliente.uf }}
            </td>
  
            <td>
              {{ cliente.municipio }}
            </td>
  
            <td>
  
              <button
                type="button"
                class="excluir"
                (click)="excluir(cliente.id)"
              >
                Excluir
              </button>
  
            </td>
  
          </tr>
  
          <tr *ngIf="clientes.length === 0">
  
            <td colspan="7">
              Nenhum cliente cadastrado.
            </td>
  
          </tr>
  
        </tbody>
  
      </table>
  
    </section>
  
  </div>
